<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WWI Naval Warfare: USA vs Russian Empire</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: monospace; background: #000; }
        #ui {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(20, 30, 40, 0.9); padding: 30px; border-radius: 8px;
            color: #fff; text-align: center; border: 2px solid #5a6d80; z-index: 10;
        }
        button {
            background: #5a6d80; color: white; border: none; padding: 10px 20px;
            margin: 10px; cursor: pointer; font-size: 16px; font-family: monospace;
        }
        button:hover { background: #7a8d10; }
        input { padding: 10px; width: 200px; text-align: center; font-family: monospace; }
        #status { position: absolute; top: 10px; left: 10px; color: white; z-index: 10; font-size: 18px; }
    </style>
</head>
<body>

    <div id="status">Waiting for Faction Selection...</div>

    <div id="ui">
        <h2>WWI NAVAL COMBAT (P2P MULTIPLAYER)</h2>
        <p>Choose your side to initialize connection:</p>
        <button id="hostBtn">Host Match (US Navy)</button>
        <br><br>
        <input type="text" id="joinId" placeholder="Enter Friend's Match ID">
        <br>
        <button id="joinBtn">Join Match (Imperial Russian Navy)</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

    <script>
        const ui = document.getElementById('ui');
        const statusText = document.getElementById('status');
        let peer, conn;
        let myFaction = '';
        let gameStarted = false;

        // --- 3D ENGINE SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x607d8b); // Overcast WWI sky

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Lighting
        const light = new THREE.DirectionalLight(0xffffff, 0.8);
        light.position.set(50, 100, 50);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0x404040, 1.2));

        // The Ocean
        const oceanGeo = new THREE.PlaneGeometry(2000, 2000);
        const oceanMat = new THREE.MeshPhongMaterial({ color: 0x1a2e3b, roughness: 0.8 });
        const ocean = new THREE.Mesh(oceanGeo, oceanMat);
        ocean.rotation.x = -Math.PI / 2;
        scene.add(ocean);

        // Ship Generation Meshes
        function createWarship(faction) {
            const shipGroup = new THREE.Group();
            if (faction === 'USA') {
                // US Standard Dreadnought: Wide, Haze Gray, boxy bridge structures
                const hull = new THREE.Mesh(new THREE.BoxGeometry(3, 1.5, 9), new THREE.MeshPhongMaterial({ color: 0x708090 }));
                const deck = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.8, 4), new THREE.MeshPhongMaterial({ color: 0x506070 }));
                deck.position.set(0, 0.5, 0);
                shipGroup.add(hull, deck);
            } else {
                // Imperial Russian Gangut-class: Sleek, Low Profile, Dark Baltic Gray
                const hull = new THREE.Mesh(new THREE.BoxGeometry(2.2, 1.2, 10.5), new THREE.MeshPhongMaterial({ color: 0x3a3d40 }));
                const deck = new THREE.Mesh(new THREE.BoxGeometry(1.0, 1.4, 5), new THREE.MeshPhongMaterial({ color: 0x252729 }));
                deck.position.set(0, 0.4, -0.5);
                shipGroup.add(hull, deck);
            }
            return shipGroup;
        }

        let myShip, enemyShip;

        // --- NETWORK & LOBBY LOGIC ---

        // Player 1: Host (USA)
        document.getElementById('hostBtn').addEventListener('click', () => {
            myFaction = 'USA';
            peer = new Peer();
            
            statusText.innerText = "Generating Match ID...";
            
            peer.on('open', (id) => {
                ui.innerHTML = `<h3>Match Created!</h3>
                                <p>Send this Match ID to your opponent:</p>
                                <b style="font-size:20px; color:#ffeb3b;">${id}</b>
                                <p>Waiting for Russian Fleet to connect...</p>`;
                statusText.innerText = "Faction: United States Navy";
                
                // Initialize local ship position
                myShip = createWarship('USA');
                myShip.position.set(-20, 0.75, 0);
                scene.add(myShip);
            });

            peer.on('connection', (connection) => {
                conn = connection;
                setupNetworkTransmissions();
            });
        });

        // Player 2: Join (Russian Empire)
        document.getElementById('joinBtn').addEventListener('click', () => {
            const targetId = document.getElementById('joinId').value.trim();
            if (!targetId) return alert("Please enter a valid Match ID");

            myFaction = 'RUS';
            peer = new Peer();

            peer.on('open', () => {
                statusText.innerText = "Connecting to US Fleet...";
                conn = peer.connect(targetId);
                setupNetworkTransmissions();
            });
        });

        function setupNetworkTransmissions() {
            conn.on('open', () => {
                ui.style.display = 'none';
                gameStarted = true;
                
                if (myFaction === 'RUS') {
                    statusText.innerText = "Faction: Imperial Russian Navy";
                    myShip = createWarship('RUS');
                    myShip.position.set(20, 0.6, 0);
                    myShip.rotation.y = Math.PI; // Face the US ship
                    scene.add(myShip);

                    enemyShip = createWarship('USA');
                    scene.add(enemyShip);
                } else {
                    statusText.innerText = "Combat Active: Russian Fleet Detected!";
                    enemyShip = createWarship('RUS');
                    scene.add(enemyShip);
                }
            });

            // Receive enemy movement updates directly from their browser
            conn.on('data', (data) => {
                if (enemyShip) {
                    enemyShip.position.x = data.x;
                    enemyShip.position.z = data.z;
                    enemyShip.rotation.y = data.rotation;
                }
            });
        }

        // --- GAMEPLAY INPUTS & PHYSICS ---
        const keys = {};
        window.addEventListener('keydown', (e) => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', (e) => keys[e.key.toLowerCase()] = false);

        let speed = 0;
        const maxSpeed = 0.12; // Massive WWI battleships accelerate slowly
        const acceleration = 0.002;
        const friction = 0.985;
        const turnSpeed = 0.012;

        // --- MAIN RENDER AND SYNC LOOP ---
        function animate() {
            requestAnimationFrame(animate);

            if (gameStarted && myShip) {
                // Throttle inputs
                if (keys['w']) speed = Math.min(speed + acceleration, maxSpeed);
                else if (keys['s']) speed = Math.max(speed - acceleration, -maxSpeed / 2);
                else speed *= friction;

                // Rudder turning mechanics
                if (keys['a']) myShip.rotation.y += turnSpeed;
                if (keys['d']) myShip.rotation.y -= turnSpeed;

                myShip.translateZ(speed);

                // Send layout matrix details to remote peer
                conn.send({
                    x: myShip.position.x,
                    z: myShip.position.z,
                    rotation: myShip.rotation.y
                });

                // Smooth Third-Person Chase Camera Tracking
                const relativeCamOffset = new THREE.Vector3(0, 6, -18);
                const camOffset = relativeCamOffset.applyMatrix4(myShip.matrixWorld);
                camera.position.lerp(camOffset, 0.08);
                camera.lookAt(myShip.position.x, myShip.position.y + 1, myShip.position.z);
            } else {
                // Idle cinematic pan before connecting
                const time = Date.now() * 0.0003;
                camera.position.x = Math.sin(time) * 40;
                camera.position.z = Math.cos(time) * 40;
                camera.position.y = 15;
                camera.lookAt(0, 0, 0);
            }

            renderer.render(scene, camera);
        }

        // Responsive window scaling
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
