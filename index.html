<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WWI Naval Warfare – USA vs USSR (Multiplayer)</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }
    #status {
      position: absolute;
      top: 10px;
      left: 10px;
      color: white;
      font-family: Arial, sans-serif;
      background: rgba(0, 0, 0, 0.6);
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 14px;
      border: 1px solid #444;
      z-index: 10;
      pointer-events: none;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/three@0.152.0/build/three.min.js"></script>
</head>
<body>

<div id="status">Connecting to server...</div>

<script>
// ======================================================
// ===============  OCEAN SYSTEM ========================
// ======================================================
function createOcean() {
  const geo = new THREE.PlaneGeometry(2000, 2000, 128, 128);
  const mat = new THREE.MeshPhongMaterial({
    color: 0x1e90ff,
    shininess: 20,
    flatShading: true
  });
  const ocean = new THREE.Mesh(geo, mat);
  ocean.rotation.x = -Math.PI / 2;
  return ocean;
}

// ======================================================
// ===============  SHIP CLASS ==========================
// ======================================================
class Ship {
  constructor(color = 0x333333) {
    this.mesh = new THREE.Mesh(
      new THREE.BoxGeometry(4, 1, 12),
      new THREE.MeshStandardMaterial({ color: color })
    );
    this.mesh.position.y = 1;

    this.speed = 0;
    this.turnSpeed = 0.02;

    this.keys = {};
    window.addEventListener('keydown', e => this.keys[e.code] = true);
    window.addEventListener('keyup', e => this.keys[e.code] = false);
  }

  update() {
    if (this.keys['KeyW']) this.speed = 0.2;
    else if (this.keys['KeyS']) this.speed = -0.1;
    else this.speed *= 0.95; // Water drag friction

    if (this.keys['KeyA']) this.mesh.rotation.y += this.turnSpeed;
    if (this.keys['KeyD']) this.mesh.rotation.y -= this.turnSpeed;

    const forward = new THREE.Vector3(0, 0, 1).applyQuaternion(this.mesh.quaternion);
    this.mesh.position.add(forward.multiplyScalar(this.speed));
  }
}

// ======================================================
// ===============  SCENE SETUP =========================
// ======================================================
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// Lighting
scene.add(new THREE.DirectionalLight(0xffffff, 0.8));
scene.add(new THREE.AmbientLight(0x888888));

// Ocean
const ocean = createOcean();
scene.add(ocean);

// Local Player Ship (Blue - USA)
const player = new Ship(0x4444ff);
scene.add(player.mesh);

camera.position.set(0, 8, -18);

// ======================================================
// ===============  PROJECTILES =========================
// ======================================================
const bullets = [];

window.addEventListener('click', () => {
  const b = new THREE.Mesh(
    new THREE.SphereGeometry(0.2),
    new THREE.MeshBasicMaterial({ color: 0xffaa00 })
  );

  // Position bullet at front deck of the ship
  b.position.copy(player.mesh.position)
    .add(new THREE.Vector3(0, 1, 6).applyQuaternion(player.mesh.quaternion));

  // Forward velocity vector mapping
  b.userData.vel = new THREE.Vector3(0, 0, 1)
    .applyQuaternion(player.mesh.quaternion)
    .multiplyScalar(1.2);

  scene.add(b);
  bullets.push(b);
});

// ======================================================
// ===============  MULTIPLAYER CLIENT ==================
// ======================================================
const statusElement = document.getElementById("status");
let socket;
let players = {}; // Fleet tracking container for remote players

function connect() {
  // Points to your local or deployed WebSocket server
  socket = new WebSocket("ws://localhost:8080");

  socket.onopen = () => {
    statusElement.textContent = "Connected to Server | Team: USA";
    statusElement.style.color = "#4caf50";
  };

  socket.onmessage = msg => {
    const data = JSON.parse(msg.data);

    if (data.type === "state") {
      for (let id in data.players) {
        // If a new player has joined, spawn them into the scene (Red - USSR)
        if (!players[id]) {
          players[id] = new Ship(0xff4444);
          scene.add(players[id].mesh);
        }
        
        // Synchronize remote player spatial coordinates
        players[id].mesh.position.set(
          data.players[id].x,
          1,
          data.players[id].z
        );
        players[id].mesh.rotation.y = data.players[id].rot;
      }

      // Handle disconnected players by cleaning them from the scene grid
      for (let id in players) {
        if (!data.players[id]) {
          scene.remove(players[id].mesh);
          delete players[id];
        }
      }
    }
  };

  socket.onclose = () => {
    statusElement.textContent = "Disconnected – retrying connection…";
    statusElement.style.color = "#f44336";
    setTimeout(connect, 2000);
  };
}

connect();

// Send local engine metrics 20 times per second to syncing socket
setInterval(() => {
  if (socket && socket.readyState === WebSocket.OPEN) {
    socket.send(JSON.stringify({
      x: player.mesh.position.x,
      z: player.mesh.position.z,
      rot: player.mesh.rotation.y
    }));
  }
}, 50);

// ======================================================
// ===============  GAME LOOP ===========================
// ======================================================
function animate() {
  requestAnimationFrame(animate);

  // Handle local physics update
  player.update();

  // Update dynamic bullet vector trajectories
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.position.add(b.userData.vel);

    // Range threshold bounds collection
    if (b.position.distanceTo(player.mesh.position) > 500) {
      scene.remove(b);
      bullets.splice(i, 1);
    }
  }

  // Camera third-person smooth tracking (chase camera)
  const camTarget = player.mesh.position.clone()
    .add(new THREE.Vector3(0, 6, -14).applyQuaternion(player.mesh.quaternion));

  camera.position.lerp(camTarget, 0.12);
  camera.lookAt(player.mesh.position);

  renderer.render(scene, camera);
}

// Responsive window resizing adjustment
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>

</body>
</html>
